<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Streamüberwachung</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.17/dist/tailwind.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <h1>Streamüberwachung</h1>
        <p>Lokale Kontrolle für HLS, HTTP und RTMP</p>
      </div>
      <div id="run-badge" class="badge">
        <span class="dot"></span>
        Gestoppt
      </div>
    </div>
  </header>

  <main class="wrap layout">
    <section class="card">
      <h2>Einstellungen</h2>
      <form id="settings-form">
        <label>
          <span class="label">Stream-URL</span>
          <input name="stream_url" type="text" placeholder="https://example.com/live/stream.m3u8">
        </label>
        <div class="grid-2" style="margin-top:16px">
          <label>
            <span class="label">Telegram Bot-Token</span>
            <input name="telegram_bot_token" type="password" autocomplete="off">
          </label>
          <label>
            <span class="label">Telegram Chat-ID</span>
            <input name="telegram_chat_id" type="text">
          </label>
        </div>
        <div class="grid-2" style="margin-top:16px">
          <label>
            <span class="label">Helligkeitsschwelle (Schwarzbild)</span>
            <input name="brightness_threshold" type="number" min="0" max="255" step="0.5">
          </label>
          <label>
            <span class="label">Frame-Differenz (Freeze)</span>
            <input name="freeze_threshold" type="number" min="0" step="0.01">
          </label>
          <label>
            <span class="label">Audio (dBFS, Stille)</span>
            <input name="audio_rms_threshold" type="number" min="-100" max="0" step="0.5">
          </label>
          <label>
            <span class="label">Prüfintervall (Sekunden)</span>
            <input name="check_interval_seconds" type="number" min="3" max="600" step="1">
          </label>
          <label>
            <span class="label">Cooldown nach Alarm (Sekunden)</span>
            <input name="cooldown_seconds" type="number" min="0" max="86400" step="1">
          </label>
          <label class="check">
            <input name="send_screenshot" type="checkbox">
            Screenshot an Telegram senden
          </label>
        </div>
        <p id="form-feedback" class="feedback"></p>
        <div class="actions">
          <button type="submit" class="btn btn-primary">Speichern</button>
          <button type="button" id="btn-telegram" class="btn btn-ghost">Telegram testen</button>
          <button type="button" id="btn-start" class="btn btn-accent">Überwachung starten</button>
          <button type="button" id="btn-stop" class="btn btn-danger hidden">Überwachung stoppen</button>
        </div>
      </form>
    </section>

    <div class="stack">
      <section class="card">
        <h2>Status</h2>
        <dl>
          <div class="status-row">
            <dt>Überwachung</dt>
            <dd id="status-running">Gestoppt</dd>
          </div>
          <div class="status-row">
            <dt>Letzte Prüfung</dt>
            <dd id="status-time">–</dd>
          </div>
          <dt class="label">Ergebnis</dt>
          <dd id="status-message" class="status-box">Noch keine Prüfung.</dd>
        </dl>
        <div class="metrics">
          <div class="metric">
            <span>Helligkeit</span>
            <strong id="metric-brightness">–</strong>
          </div>
          <div class="metric">
            <span>Frame-Diff</span>
            <strong id="metric-diff">–</strong>
          </div>
          <div class="metric">
            <span>Audio dBFS</span>
            <strong id="metric-audio">–</strong>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="preview-head">
          <h2>Vorschau</h2>
          <span id="preview-label" class="preview-label">Kein Bild</span>
        </div>
        <div class="preview-frame">
          <img id="preview-image" alt="Aktuelles Stream-Bild" class="hidden">
          <div id="preview-empty" class="preview-empty">Noch kein Frame empfangen</div>
        </div>
      </section>
    </div>

    <section class="card span-all">
      <div class="preview-head">
        <h2>Letzte Alarme</h2>
        <button type="button" id="btn-clear-alerts" class="btn btn-danger" disabled>Historie löschen</button>
      </div>
      <div class="table-wrap" style="margin-top:16px">
        <table>
          <thead>
            <tr>
              <th>Zeit</th>
              <th>Typ</th>
              <th>Meldung</th>
              <th class="actions-col"> </th>
            </tr>
          </thead>
          <tbody id="alert-body">
            <tr>
              <td colspan="4" class="empty">Noch keine Alarme.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script>
    const ALERT_LABELS = {
      black: "Schwarzbild",
      freeze: "Eingefrorenes Bild",
      silence: "Kein Ton",
      offline: "Stream-Ausfall"
    };

    const form = document.getElementById("settings-form");
    const feedback = document.getElementById("form-feedback");
    const btnStart = document.getElementById("btn-start");
    const btnStop = document.getElementById("btn-stop");
    const btnTelegram = document.getElementById("btn-telegram");
    const btnClearAlerts = document.getElementById("btn-clear-alerts");
    const trashIcon =
      '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8" aria-hidden="true">' +
      '<path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2"/>' +
      "</svg>";

    function setFeedback(text, ok) {
      feedback.textContent = text || "";
      feedback.className = "feedback" + (ok === false ? " is-error" : ok ? " is-ok" : "");
    }

    function toNumber(value) {
      const parsed = Number(String(value).replace(",", "."));
      return Number.isFinite(parsed) ? parsed : 0;
    }

    function formPayload() {
      const data = new FormData(form);
      return {
        stream_url: data.get("stream_url") || "",
        telegram_bot_token: data.get("telegram_bot_token") || "",
        telegram_chat_id: data.get("telegram_chat_id") || "",
        brightness_threshold: toNumber(data.get("brightness_threshold")),
        freeze_threshold: toNumber(data.get("freeze_threshold")),
        audio_rms_threshold: toNumber(data.get("audio_rms_threshold")),
        check_interval_seconds: toNumber(data.get("check_interval_seconds")),
        cooldown_seconds: toNumber(data.get("cooldown_seconds")),
        send_screenshot: form.elements.send_screenshot.checked
      };
    }

    function fillSettings(s) {
      form.elements.stream_url.value = s.stream_url || "";
      form.elements.telegram_bot_token.value = s.telegram_bot_token || "";
      form.elements.telegram_chat_id.value = s.telegram_chat_id || "";
      form.elements.brightness_threshold.value = s.brightness_threshold;
      form.elements.freeze_threshold.value = s.freeze_threshold;
      form.elements.audio_rms_threshold.value = s.audio_rms_threshold;
      form.elements.check_interval_seconds.value = s.check_interval_seconds;
      form.elements.cooldown_seconds.value = s.cooldown_seconds;
      form.elements.send_screenshot.checked = !!s.send_screenshot;
      setRunning(s.monitoring_enabled);
    }

    function setRunning(running) {
      const badge = document.getElementById("run-badge");
      const status = document.getElementById("status-running");
      status.textContent = running ? "Läuft" : "Gestoppt";
      status.className = running ? "is-live-text" : "";
      btnStart.classList.toggle("hidden", running);
      btnStop.classList.toggle("hidden", !running);
      badge.className = running ? "badge is-live" : "badge";
      badge.innerHTML = running
        ? '<span class="dot"></span> Läuft'
        : '<span class="dot"></span> Gestoppt';
    }

    function formatTime(value) {
      if (!value) return "–";
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "–";
      return date.toLocaleString("de-DE");
    }

    function formatNum(value, digits) {
      if (value === null || value === undefined) return "–";
      return Number(value).toFixed(digits);
    }

    async function api(path, options) {
      const response = await fetch(path, options);
      const data = await response.json().catch(function () { return {}; });
      if (!response.ok) {
        const detail = data.detail;
        const message = typeof detail === "string" ? detail : (data.message || "Anfrage fehlgeschlagen.");
        throw new Error(message);
      }
      return data;
    }

    async function loadSettings() {
      fillSettings(await api("/api/settings"));
    }

    async function refreshStatus() {
      const status = await api("/api/status");
      setRunning(status.monitoring_enabled);
      document.getElementById("status-time").textContent = formatTime(status.last_check_at);
      document.getElementById("status-message").textContent = status.message || "Noch keine Prüfung.";
      document.getElementById("metric-brightness").textContent = formatNum(status.brightness, 1);
      document.getElementById("metric-diff").textContent = formatNum(status.frame_diff, 2);
      document.getElementById("metric-audio").textContent =
        status.audio_rms === null || status.audio_rms === undefined
          ? "–"
          : formatNum(status.audio_rms, 1) + " dBFS";

      const img = document.getElementById("preview-image");
      const empty = document.getElementById("preview-empty");
      const label = document.getElementById("preview-label");
      if (status.has_preview) {
        img.src = "/preview.jpg?t=" + Date.now();
        img.classList.remove("hidden");
        empty.classList.add("hidden");
        label.textContent = "Aktueller Frame";
      } else {
        img.classList.add("hidden");
        empty.classList.remove("hidden");
        label.textContent = "Kein Bild";
      }
    }

    async function refreshAlerts() {
      const alerts = await api("/api/alerts");
      const body = document.getElementById("alert-body");
      btnClearAlerts.disabled = !alerts.length;
      if (!alerts.length) {
        body.innerHTML = '<tr><td colspan="4" class="empty">Noch keine Alarme.</td></tr>';
        return;
      }
      body.innerHTML = alerts.map(function (alert) {
        const type = ALERT_LABELS[alert.alert_type] || alert.alert_type;
        return (
          "<tr>" +
          '<td class="muted">' + formatTime(alert.created_at) + "</td>" +
          '<td class="type">' + type + "</td>" +
          "<td>" + escapeHtml(alert.message) + "</td>" +
          '<td class="row-actions">' +
          '<button type="button" class="btn-icon" data-delete-alert="' + alert.id + '" title="Alarm löschen" aria-label="Alarm löschen">' +
          trashIcon +
          "</button>" +
          "</td>" +
          "</tr>"
        );
      }).join("");
    }

    function escapeHtml(text) {
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      try {
        await api("/api/settings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(formPayload())
        });
        setFeedback("Einstellungen gespeichert.", true);
      } catch (err) {
        setFeedback(err.message, false);
      }
    });

    btnTelegram.addEventListener("click", async function () {
      try {
        const payload = formPayload();
        const result = await api("/api/telegram/test", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            telegram_bot_token: payload.telegram_bot_token,
            telegram_chat_id: payload.telegram_chat_id
          })
        });
        setFeedback(result.message, result.ok);
      } catch (err) {
        setFeedback(err.message, false);
      }
    });

    btnStart.addEventListener("click", async function () {
      try {
        await api("/api/settings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(formPayload())
        });
        const result = await api("/api/monitor/start", { method: "POST" });
        setRunning(true);
        setFeedback(result.message, true);
      } catch (err) {
        setFeedback(err.message, false);
      }
    });

    btnStop.addEventListener("click", async function () {
      try {
        const result = await api("/api/monitor/stop", { method: "POST" });
        setRunning(false);
        setFeedback(result.message, true);
      } catch (err) {
        setFeedback(err.message, false);
      }
    });

    btnClearAlerts.addEventListener("click", async function () {
      if (!window.confirm("Alle Alarme unwiderruflich löschen?")) {
        return;
      }
      try {
        const result = await api("/api/alerts", { method: "DELETE" });
        await refreshAlerts();
        setFeedback(result.message, true);
      } catch (err) {
        setFeedback(err.message, false);
      }
    });

    document.getElementById("alert-body").addEventListener("click", async function (event) {
      const button = event.target.closest("[data-delete-alert]");
      if (!button) {
        return;
      }
      const alertId = button.getAttribute("data-delete-alert");
      try {
        await api("/api/alerts/" + alertId, { method: "DELETE" });
        await refreshAlerts();
      } catch (err) {
        setFeedback(err.message, false);
      }
    });

    async function tick() {
      try {
        await refreshStatus();
        await refreshAlerts();
      } catch (_err) {
        /* Polling darf die Oberfläche nicht stören. */
      }
    }

    loadSettings()
      .then(tick)
      .catch(function (err) { setFeedback(err.message, false); });
    setInterval(tick, 3000);
  </script>
</body>
</html>
